<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gán nhãn truy hồi</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5d6672; --line:#dfe3e8;
  --accent:#2457d6; --l2:#1f8a4c; --l1:#b7791f; --l0:#8a4b4b; --sel:#e8efff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--ink:#e8ebef;--mute:#9aa4b1;--line:#323943;--accent:#7aa2ff;--l2:#4cc17f;--l1:#e0a94a;--l0:#d98a8a;--sel:#232c42}
}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--ink:#e8ebef;--mute:#9aa4b1;--line:#323943;--accent:#7aa2ff;--l2:#4cc17f;--l1:#e0a94a;--l0:#d98a8a;--sel:#232c42}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
header h1{font-size:17px;margin:0 auto 0 0}
input[type=text]{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);width:150px}
button,.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q small{color:var(--mute)}
.q h2{margin:4px 0 0;font-size:19px;font-weight:600}
.guide{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px}
.guide b.l2{color:var(--l2)}.guide b.l1{color:var(--l1)}.guide b.l0{color:var(--l0)}
.cand{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.cand.active{outline:2px solid var(--accent)}
.cand .txt{white-space:pre-wrap;max-height:9.5em;overflow:auto;font-size:14px;border-left:3px solid var(--line);padding-left:10px;margin:0 0 10px}
.cand.open .txt{max-height:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .id{color:var(--mute);font-size:13px;margin-right:auto}
.lv{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.lv[data-v="2"].on{background:var(--l2);color:#fff;border-color:var(--l2)}
.lv[data-v="1"].on{background:var(--l1);color:#fff;border-color:var(--l1)}
.lv[data-v="0"].on{background:var(--l0);color:#fff;border-color:var(--l0)}
.chips{display:flex;gap:6px;font-size:12px;color:var(--mute);margin-bottom:8px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.nav{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center}
.nav .sp{margin-right:auto;color:var(--mute);font-size:13px}
#banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
#banner.stop{background:#7a1f1f;color:#fff}
#banner.done{background:#1f6b3a;color:#fff}
#stopBoth{border-color:var(--l0);color:var(--l0)}
.empty{text-align:center;padding:60px 10px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gán nhãn truy hồi <span id="modeTag" class="tag" hidden></span></h1>
    <input type="text" id="who" placeholder="Mã người gán (vd. A)" aria-label="Mã người gán nhãn">
    <label class="btn" id="fileBtn">Mở file nhiệm vụ<input type="file" id="file" accept=".json" hidden></label>
    <button id="export" class="primary" disabled>Xuất kết quả</button>
    <button id="stopBoth" type="button" hidden>Dừng cả hai</button>
  </header>
  <div id="banner" role="alert" hidden></div>
  <div class="bar"><i id="prog"></i></div>
  <div id="app"><div class="empty">Chọn file <b>annotation_tasks.json</b> (hoặc <b>adjudication_tasks.json</b>) để bắt đầu.</div></div>
</div>

<script>
"use strict";
var tasks = [], labels = {}, referenceAnswers = {}, verificationNotes = {}, adjudicatedFlags = {},
    cur = 0, act = 0, fileName = "", adjMode = false, serverMode = false, stopped = false, touched = false;

function store(op, k, v){ try { return op==="get" ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch(e){ return null; } }
function skey(){ return "annot:" + fileName + ":" + (document.getElementById("who").value || "?"); }
function save(){ store("set", skey(), JSON.stringify({labels:labels, reference_answers:referenceAnswers,
  verification_notes:verificationNotes, adjudicated:adjudicatedFlags})); }
function load(){ try {
  var r = store("get", skey()), parsed = r ? JSON.parse(r) : {};
  if (parsed && parsed.labels) { labels=parsed.labels; referenceAnswers=parsed.reference_answers||{};
    verificationNotes=parsed.verification_notes||{}; adjudicatedFlags=parsed.adjudicated||{}; }
  else { labels=parsed||{}; referenceAnswers={}; verificationNotes={}; adjudicatedFlags={}; }
} catch(e){ labels={}; referenceAnswers={}; verificationNotes={}; adjudicatedFlags={}; } }

function done(t){ var l = labels[t.task_id] || {}; return t.candidates.every(function(c){ return l[c.key] !== undefined; }); }
function nDone(){ return tasks.filter(done).length; }

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(k){
    if (k==="class") e.className = attrs[k]; else if (k==="text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(c){ e.appendChild(c); });
  return e;
}

function render(){
  var app = document.getElementById("app"); app.textContent = "";
  document.getElementById("export").disabled = !tasks.length;
  var p = tasks.length ? Math.round(100*nDone()/tasks.length) : 0;
  document.getElementById("prog").style.width = p + "%";
  if (!tasks.length) { app.appendChild(el("div",{class:"empty",text:"Chưa có nhiệm vụ."})); return; }
  var t = tasks[cur], lab = labels[t.task_id] || {};

  var q = el("div",{class:"q"},[
    el("small",{text:"Câu " + (cur+1) + "/" + tasks.length + " · đã xong " + nDone() + (t.double ? " · câu gán đôi" : "")}),
    el("h2",{text:t.query})
  ]);
  app.appendChild(q);
  var meta = el("div",{class:"q"});
  meta.appendChild(el("label",{text:"Đáp án tham chiếu (người gán có thể nhập hoặc chỉnh sửa)"}));
  var refInput = el("textarea",{id:"referenceAnswer",rows:"4",style:"width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit"});
  refInput.value = referenceAnswers[t.task_id] || t.reference_answer || "";
  refInput.addEventListener("input", function(){ referenceAnswers[t.task_id] = refInput.value; save(); pushMeta(t); });
  meta.appendChild(refInput);
  var noteLabel = el("label",{text:"Ghi chú kiểm chứng / phân xử"});
  noteLabel.style.display = "block"; noteLabel.style.marginTop = "8px";
  meta.appendChild(noteLabel);
  var noteInput = el("textarea",{id:"verificationNotes",rows:"2",style:"width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit"});
  noteInput.value = verificationNotes[t.task_id] || "";
  noteInput.addEventListener("input", function(){ verificationNotes[t.task_id] = noteInput.value; save(); pushMeta(t); });
  meta.appendChild(noteInput);
  var adjLabel = el("label",{text:"Đã phân xử (ADJUDICATED)"});
  adjLabel.style.display = "block"; adjLabel.style.marginTop = "8px";
  var adjInput = el("input",{type:"checkbox"});
  adjInput.checked = !!adjudicatedFlags[t.task_id];
  adjInput.addEventListener("change", function(){ adjudicatedFlags[t.task_id] = adjInput.checked; save(); pushMeta(t); });
  adjLabel.appendChild(adjInput); meta.appendChild(adjLabel);
  app.appendChild(meta);
  app.appendChild(el("p",{class:"guide"},[
    el("span",{},[el("b",{class:"l2",text:"2"}), document.createTextNode(" Trả lời trực tiếp")]),
    el("span",{},[el("b",{class:"l1",text:"1"}), document.createTextNode(" Ngữ cảnh bổ trợ")]),
    el("span",{},[el("b",{class:"l0",text:"0"}), document.createTextNode(" Không liên quan (sai vắc xin / sai mục)")]),
    el("span",{text:"Phím: J/K đổi đoạn · 2/1/0 chấm · N/P đổi câu · Enter mở rộng đoạn"})
  ]));

  t.candidates.forEach(function(c, i){
    var card = el("div",{class:"cand" + (i===act?" active":"")});
    if (adjMode) {
      var chips = el("div",{class:"chips"});
      [["Người", c.human],["Người 2", c.human2],["LLM", c.llm]].forEach(function(x){
        if (x[1] !== null && x[1] !== undefined) chips.appendChild(el("span",{text: x[0] + ": " + x[1]}));
      });
      card.appendChild(chips);
    }
    card.appendChild(el("div",{class:"txt",text:c.text}));
    var row = el("div",{class:"row"},[el("span",{class:"id",text:"Đoạn " + (i+1)})]);
    [2,1,0].forEach(function(v){
      var b = el("button",{class:"lv" + (lab[c.key]===v?" on":""),"data-v":String(v),text:String(v),type:"button","aria-pressed":String(lab[c.key]===v)});
      b.onclick = function(){ setLabel(i, v); };
      row.appendChild(b);
    });
    card.appendChild(row);
    card.onclick = function(ev){ if (ev.target.tagName!=="BUTTON"){ act = i; card.classList.toggle("open"); render2active(); } };
    app.appendChild(card);
  });

  var nav = el("div",{class:"nav"},[
    el("span",{class:"sp",text: done(t) ? "✓ Đã chấm đủ" : "Còn " + t.candidates.filter(function(c){return lab[c.key]===undefined;}).length + " đoạn chưa chấm"})
  ]);
  var prev = el("button",{type:"button",text:"← Trước"}); prev.onclick = function(){ go(-1); };
  var next = el("button",{type:"button",class:"primary",text:"Sau →"}); next.onclick = function(){ go(1); };
  nav.appendChild(prev); nav.appendChild(next);
  app.appendChild(nav);
}
function render2active(){
  var cs = document.querySelectorAll(".cand");
  cs.forEach(function(c,i){ c.classList.toggle("active", i===act); });
}
function setLabel(i, v){
  if (stopped) return;
  var who = document.getElementById("who").value.trim();
  if (serverMode && !who){ alert("Nhập mã người gán (vd. tên của bạn) vào ô phía trên trước khi chấm."); return; }
  touched = true;
  var t = tasks[cur]; labels[t.task_id] = labels[t.task_id] || {};
  labels[t.task_id][t.candidates[i].key] = v; act = i; save();
  if (serverMode && done(t)) push(t, who);
  render();
}
function api(method, path, body){
  return fetch(path, {method: method, headers: {"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined})
    .then(function(r){ return r.json().then(function(j){ return {ok: r.ok, data: j}; }); });
}
function pushMeta(t){
  if (!serverMode) return;
  var who = document.getElementById("who").value.trim();
  if (!who || !labels[t.task_id] || !done(t)) return;
  push(t, who);
}
function push(t, who){
  api("POST","/api/save",{annotator_id: who, task_id: t.task_id, labels: labels[t.task_id],
    reference_answer: referenceAnswers[t.task_id] || "", verification_notes: verificationNotes[t.task_id] || "",
    adjudicated: !!adjudicatedFlags[t.task_id]}).then(function(r){
    if (!r.ok) showStop(r.data);
  }).catch(function(){ showStop({source:"mạng", reason:"mất kết nối tới máy chủ gán nhãn"}); });
}
function showStop(s){
  stopped = true;
  var b = document.getElementById("banner"); b.hidden = false; b.className = "stop";
  b.textContent = "ĐÃ DỪNG CẢ HAI LUỒNG (" + (s.source||"?") + "): " + (s.reason||"lỗi") + ". Nhãn đã chấm xong được giữ lại; chạy lại lệnh run để tiếp tục.";
  document.getElementById("stopBoth").disabled = true; document.getElementById("export").disabled = true;
}
function poll(){
  api("GET","/api/status").then(function(r){
    var s = r.data;
    if (s.state === "stopped") showStop(s);
    else if (s.state === "done"){ var b = document.getElementById("banner"); b.hidden=false; b.className="done"; b.textContent="Hoàn tất: cả hai luồng đã xong. Có thể đóng trang."; }
    else setTimeout(poll, 1000);
  }).catch(function(){ if (!stopped) showStop({source:"mạng", reason:"máy chủ gán nhãn đã tắt"}); });
}
function startServerMode(){
  api("GET","/api/tasks").then(function(r){
    if (!r.ok || !Array.isArray(r.data)) return;
    serverMode = true; tasks = r.data; fileName = "server";
    document.getElementById("fileBtn").hidden = true; document.getElementById("export").hidden = true;
    document.getElementById("stopBoth").hidden = false;
    document.getElementById("stopBoth").onclick = function(){
      if (confirm("Dừng cả luồng L và H?")) api("POST","/api/stop",{}).then(function(r){ showStop(r.data); });
    };
    loadServerLabels(); poll();
  }).catch(function(){});
}
function loadServerLabels(){
  load();
  var who = document.getElementById("who").value.trim();
  var next = function(){ if (!touched){ var f = tasks.findIndex(function(t){ return !done(t); }); cur = f >= 0 ? f : 0; act = 0; } render(); };
  if (!who) return next();
  api("GET","/api/labels?annotator=" + encodeURIComponent(who)).then(function(r){
    var saved = r.data || {};
    Object.keys(saved.labels || {}).forEach(function(k){ if (!labels[k]) labels[k] = saved.labels[k]; });
    referenceAnswers = saved.reference_answers || referenceAnswers;
    verificationNotes = saved.verification_notes || verificationNotes;
    adjudicatedFlags = saved.adjudicated || adjudicatedFlags;
    save(); next();
  }).catch(next);
}
function go(d){ cur = Math.max(0, Math.min(tasks.length-1, cur+d)); act = 0; window.scrollTo(0,0); render(); }

document.addEventListener("keydown", function(e){
  if (!tasks.length || e.target.tagName==="INPUT") return;
  var n = tasks[cur].candidates.length;
  if (e.key==="j"||e.key==="ArrowDown"){ act = Math.min(n-1,act+1); render2active(); e.preventDefault(); }
  else if (e.key==="k"||e.key==="ArrowUp"){ act = Math.max(0,act-1); render2active(); e.preventDefault(); }
  else if (e.key==="2"||e.key==="1"||e.key==="0"){ setLabel(act, +e.key); if (act<n-1){ act++; render2active(); } }
  else if (e.key==="n"||e.key==="ArrowRight"){ go(1); }
  else if (e.key==="p"||e.key==="ArrowLeft"){ go(-1); }
  else if (e.key==="Enter"){ var c = document.querySelectorAll(".cand")[act]; if (c) c.classList.toggle("open"); }
});

document.getElementById("file").addEventListener("change", function(ev){
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try { tasks = JSON.parse(r.result); } catch(e){ alert("File JSON không hợp lệ"); return; }
    fileName = f.name; adjMode = tasks.some(function(t){ return t.adjudication; });
    var tag = document.getElementById("modeTag"); tag.hidden = !adjMode; tag.textContent = "phân xử";
    load(); cur = 0; act = 0;
    var first = tasks.findIndex(function(t){ return !done(t); }); if (first >= 0) cur = first;
    render();
  };
  r.readAsText(f, "utf-8");
});
document.getElementById("who").addEventListener("keydown", function(e){ if (e.key==="Enter") this.blur(); });
document.getElementById("who").addEventListener("change", function(){
  store("set","annot:who",this.value);
  if (serverMode) loadServerLabels(); else if (tasks.length){ load(); render(); }
});
(function(){ var w = store("get","annot:who"); if (w) document.getElementById("who").value = w; })();
if (location.protocol === "http:" || location.protocol === "https:") startServerMode();

document.getElementById("export").onclick = function(){
  var who = document.getElementById("who").value.trim();
  if (!who){ alert("Nhập mã người gán nhãn trước khi xuất."); return; }
  var out = {}, partial = 0;
  tasks.forEach(function(t){ if (done(t)) out[t.task_id] = labels[t.task_id]; else if (labels[t.task_id]) partial++; });
  if (partial && !confirm(partial + " câu mới chấm dở sẽ KHÔNG được xuất. Tiếp tục?")) return;
  var blob = new Blob([JSON.stringify({annotator_id: who, mode: adjMode ? "adjudication" : "blind",
    labels: out, reference_answers: referenceAnswers, verification_notes: verificationNotes,
    adjudicated: adjudicatedFlags}, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = (adjMode ? "adjudicated_" : "human_") + who + ".json"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};
</script>
</body>
</html>

[project]
name = "vacxis-capstone-fa26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saveBro6", email = "hungmtp1309@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flagembedding>=1.4.2",
    "litellm>=1.105.1",
    "pyarrow>=26.0.0",
    "qdrant-client>=1.19.1",
]

[project.scripts]
vacxis-capstone-fa26 = "vacxis_capstone_fa26:main"
generate-test-dataset = "vacxis_capstone_fa26.testdata.cli:main"
vacxis-retrieval = "vacxis_capstone_fa26.retrieval.cli:main"
vacxis-generation = "vacxis_capstone_fa26.generation.cli:main"
vacxis-eval = "vacxis_capstone_fa26.evaluation.cli:main"
vacxis-evaluation = "vacxis_capstone_fa26.evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring local services and model weights",
]
